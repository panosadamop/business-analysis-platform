name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit, API, acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Unit tests (service level)
        working-directory: backend
        run: pytest tests/unit -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: API tests (functional)
        working-directory: backend
        run: pytest tests/api -q

      - name: Acceptance scenarios AT-01 to AT-20
        working-directory: backend
        run: pytest tests/acceptance -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (type check, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run lint

      - name: Unit and component tests
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

  end-to-end:
    name: End to end (live deployment)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the deployment
        run: |
          cp .env.example .env
          docker compose up -d --build
          # Wait for the published surface to answer.
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS http://localhost:8080/ready

      - name: Seed the reference project
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm seed

      - name: Install test dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Live API end to end
        env:
          AIT_E2E_BASE_URL: http://localhost:8080
        working-directory: backend
        run: pytest tests/e2e -q

      - name: Browser end to end
        env:
          AIT_E2E_BASE_URL: http://localhost:8080
        working-directory: frontend
        run: npx playwright test

      - name: Collect deployment logs on failure
        if: failure()
        run: docker compose logs --no-color > deployment-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: end-to-end-diagnostics
          path: |
            deployment-logs.txt
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Stop the deployment
        if: always()
        run: docker compose down -v
