server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the API through Docker's embedded DNS at request time rather than
    # once at startup, so a recreated api container (new IP) does not leave
    # nginx pointing at a dead address and answering 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # The single page application owns client side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is reached through the same origin, so no third party CORS is needed.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2g;
        proxy_read_timeout 600s;
    }

    # The web tier's own liveness.
    location = /health { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Readiness of the stack behind it, so an orchestrator can probe the
    # published surface instead of the internal API port.
    location = /ready {
        proxy_pass $api_upstream/ready;
        proxy_set_header Host $host;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
