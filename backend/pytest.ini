[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
markers =
    acceptance: a numbered system acceptance scenario from specification section 21
    e2e: runs against a live deployment; skipped unless AIT_E2E_BASE_URL is set
    slow: takes more than a few seconds
