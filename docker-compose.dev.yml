# Development overlay: hot reload, seeded data, relaxed restart policy.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
name: ai-analysis-team

services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENVIRONMENT: development
    volumes:
      - ./backend/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    environment:
      APP_ENVIRONMENT: development
    volumes:
      - ./backend/app:/app/app:ro

  seed:
    build:
      context: ./backend
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      APP_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      APP_S3_ENDPOINT: http://minio:9000
    command: ["python", "-m", "app.seed"]
    restart: "no"
